<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Vault - Logowanie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page login-page">
        <header class="header">
            <div class="header-inner">
                <a href="gamevault.html" class="logo">
                    <span class="game">Game</span><span class="vault">Vault</span>
                </a>

                <nav class="nav">
                    <a href="gamevault.html">Sklep</a>
                    <a href="biblioteka.html">Biblioteka</a>
                    <a href="#">Społeczność</a>
                </nav>

                <input class="search" type="text" placeholder="Szukaj...">

                <div class="header-right">
                    <a href="logowanie.html" class="login-link active">Zaloguj się</a>
                </div>
            </div>
        </header>

        <main class="page-main login-main">
            <section class="auth-card">
                <h1>Logowanie</h1>

                <form class="auth-form" action="#" method="post">
                    <input type="text" name="login" placeholder="Nazwa użytkownika/email..." required>
                    <input type="password" name="password" placeholder="Hasło..." required>
                    <button type="submit" class="auth-btn">Zaloguj się</button>
                </form>

                <div class="auth-separator"></div>
                <p class="auth-note">Nie masz konta? Zarejestruj się!</p>

                <form class="auth-form" action="#" method="post">
                    <input type="text" name="username" placeholder="Nazwa użytkownika..." required>
                    <input type="email" name="email" placeholder="Adres email..." required>
                    <input type="password" name="new-password" placeholder="Hasło..." required>
                    <input type="password" name="confirm-password" placeholder="Potwierdź hasło..." required>
                    <button type="submit" class="auth-btn">Zarejestruj się</button>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
