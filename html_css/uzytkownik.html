<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Vault - Użytkownik</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page user-page">
        <header class="header">
            <div class="header-inner">
                <a href="gamevault.html" class="logo">
                    <span class="game">Game</span><span class="vault">Vault</span>
                </a>

                <nav class="nav">
                    <a href="gamevault.html">Sklep</a>
                    <a href="biblioteka.html">Biblioteka</a>
                    <a href="#">Społeczność</a>
                </nav>

                <input class="search" type="text" placeholder="Szukaj...">

                <div class="header-right user-header-right">
                    <span class="user-notification" aria-hidden="true">🔔</span>
                    <a href="uzytkownik.html" class="login-link active">Użytkownik</a>
                    <span class="user-mini-avatar" aria-hidden="true">☺</span>
                </div>
            </div>
        </header>

        <main class="page-main user-main">
            <div class="main-inner">
                <section class="user-section">
                    <h1 class="user-title">Nazwa Użytkownika</h1>

                    <div class="user-profile-row">
                        <div class="profile-avatar-wrap">
                            <div class="profile-avatar" aria-hidden="true">▣</div>
                            <span class="profile-status">Zmień avatar</span>
                        </div>

                        <p class="profile-name">Nazwa Użytkownika ✎</p>
                    </div>

                    <div class="user-divider"></div>

                    <div class="user-content-placeholder" aria-hidden="true"></div>
                </section>
            </div>
        </main>
    </div>
</body>
</html>
