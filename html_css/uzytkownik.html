<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Vault - Użytkownik</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page user-page">
        <header class="header">
            <div class="header-inner">
                <a href="gamevault.html" class="logo">
                    <span class="game">Game</span><span class="vault">Vault</span>
                </a>

                <nav class="nav">
                    <a href="gamevault.html">Sklep</a>
                    <a href="biblioteka.html">Biblioteka</a>
                    <a href="#">Społeczność</a>
                </nav>

                <input class="search" type="text" placeholder="Szukaj...">

                <div class="header-right user-header-right">
                    <span class="user-notification" aria-hidden="true">🔔</span>
                    <a href="uzytkownik.html" class="login-link active">Użytkownik</a>
                    <span class="user-mini-avatar" aria-hidden="true">☺</span>
                </div>
            </div>
        </header>

        <main class="page-main user-main">
            <div class="main-inner">
                <section class="user-section">
                    <div class="user-profile-header">
                        <div class="profile-avatar-wrap">
                            <div class="profile-avatar" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <rect x="3" y="5" width="18" height="14" rx="1" stroke="currentColor" stroke-width="1.5"/>
                                    <circle cx="8.5" cy="10" r="1.8" fill="currentColor"/>
                                    <path d="M3 16l5-4 4 3 3-2 6 5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                                </svg>
                            </div>
                            <a href="#" class="profile-change-avatar">Zmień avatar</a>
                        </div>

                        <div class="profile-identity">
                            <h1 class="profile-username">
                                Nazwa Użytkownika
                                <button type="button" class="profile-edit-btn" aria-label="Edytuj nazwę użytkownika">✎</button>
                            </h1>
                        </div>
                    </div>

                    <div class="user-divider"></div>

                    <ul class="user-details">
                        <li>Data założenia konta: <span>01-01-1970</span></li>
                        <li>Status konta: <span>Aktywne</span></li>
                        <li class="user-detail-field">
                            <span class="user-detail-label">Adres e-mail:</span>
                            <div class="user-detail-row">
                                <span class="user-detail-value">adres@email.com</span>
                                <a href="#" class="user-change-link">Zmień <span aria-hidden="true">✎</span></a>
                            </div>
                        </li>
                        <li class="user-detail-field">
                            <span class="user-detail-label">Numer telefonu:</span>
                            <div class="user-detail-row">
                                <span class="user-detail-value">+00 ********12</span>
                                <a href="#" class="user-change-link">Zmień <span aria-hidden="true">✎</span></a>
                            </div>
                        </li>
                    </ul>

                    <div class="user-actions">
                        <a href="#" class="user-action-btn">Historia zakupów</a>
                        <a href="#" class="user-action-btn">Preferencje sklepu</a>
                    </div>
                </section>
            </div>
        </main>
    </div>
</body>
</html>
